<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Medical Information</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        .text-evan { color: #2C6F45; }
        .bg-evan { background-color: #2C6F45; }
        .border-evan { border-color: #2C6F45; }
        .card-header-evan { background-color: #4CAF50; }
        /* Style for the button icons */
        .pat-edit-btn {
            background-color: transparent;
            border: none;
            padding: 0.25rem;
            line-height: 1;
        }
        .pat-edit-btn:hover {
            color: #1a5632;
        }
    </style>
</head>
<body class="p-4 sm:p-6 lg:p-8">

    <!-- Top header section -->
    <div class="flex justify-between items-end mb-6 pb-2 border-b border-gray-300">
        <!-- Left side: Logo and Name -->
        <div class="flex items-center space-x-2">
            <img src="https://placehold.co/40x40/4CAF50/FFFFFF?text=EVAN" alt="EVAN logo" class="w-10 h-10 rounded-full">
            <span class="text-xl font-bold text-gray-700">EVAN</span>
        </div>

        <!-- Right side: File Info -->
        <div id="Div_File_Info" class="text-right text-gray-500 text-xs sm:text-sm">
            <h4>
                <span id="Span_Version" class="mr-2 text-green-600 font-semibold">v1.0.0</span>
                <span id="Span_CompleteEmpName" class="mr-2">Dr. Chen</span>
                <span id="Span_CompleteDateTime">2023/10/27 15:30</span>
            </h4>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="container mx-auto max-w-4xl">

        <!-- Patient Info Card (NOW FIRST) -->
        <div class="bg-white rounded-lg shadow-lg mb-6 overflow-hidden">
            <!-- Card Header -->
            <div id="collapse_header_patinfo" class="bg-gray-200 p-4 flex items-center justify-between cursor-pointer" data-collapse-target="collapse_PatInfoContent">
                <label class="text-lg font-semibold text-gray-700">基本資料 (Basic Info)</label>
                <button class="toggle-btn text-gray-500">
                    <svg class="w-6 h-6 transition-transform transform" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                    </svg>
                </button>
            </div>
            <!-- Card Body -->
            <div id="collapse_PatInfoContent" class="collapse-content overflow-hidden transition-all duration-300 ease-in-out">
                <div class="p-4 grid sm:grid-cols-2 lg:grid-cols-3 gap-y-4 gap-x-6">
                    <!-- Form Row -->
                    <div class="flex items-center">
                        <span class="font-medium text-gray-600 w-24 flex-shrink-0">姓名 :</span>
                        <span id="PatName" class="text-gray-800">王大明</span>
                    </div>
                    <div class="flex items-center">
                        <span class="font-medium text-gray-600 w-24 flex-shrink-0">性別 :</span>
                        <span id="PatGender" class="text-gray-800">男</span>
                    </div>
                    <div class="flex items-center">
                        <span class="font-medium text-gray-600 w-24 flex-shrink-0">年齡 :</span>
                        <span id="PatAge" class="text-gray-800">45</span>
                    </div>
                    <div class="flex items-center">
                        <span class="font-medium text-gray-600 w-24 flex-shrink-0">出生日期 :</span>
                        <span id="PatDOB" class="text-gray-800">1978/05/20</span>
                    </div>
                    <div class="flex items-center">
                        <span class="font-medium text-gray-600 w-24 flex-shrink-0">血型 :</span>
                        <span id="PatBloodType" class="text-gray-800">O+</span>
                    </div>
                    <!-- Added '身份證字號' -->
                    <div class="flex items-center">
                        <span class="font-medium text-gray-600 w-24 flex-shrink-0">身份證字號 :</span>
                        <span id="PatIDNumber" class="text-gray-800">A123456789</span>
                    </div>
                    <!-- Added '病歷號' -->
                    <div class="flex items-center">
                        <span class="font-medium text-gray-600 w-24 flex-shrink-0">病歷號 :</span>
                        <span id="PatMedRecNumber" class="text-gray-800">M1234567</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Surgery Info Card (NOW SECOND) -->
        <div class="bg-white rounded-lg shadow-lg mb-6 overflow-hidden">
            <!-- Card Header -->
            <div id="collapse_header_surgery" class="bg-gray-200 p-4 flex items-center justify-between cursor-pointer" data-collapse-target="collapse_SurgeryContent">
                <label class="text-lg font-semibold text-gray-700">手術資訊 (Surgery Info)</label>
                <button class="toggle-btn text-gray-500">
                    <svg class="w-6 h-6 transition-transform transform" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                    </svg>
                </button>
            </div>
            <!-- Card Body -->
            <div id="collapse_SurgeryContent" class="collapse-content overflow-hidden transition-all duration-300 ease-in-out">
                <div class="p-4 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-y-4 gap-x-6">
                    <!-- Scheduled Surgery Date -->
                    <div class="flex items-center">
                        <span class="font-medium text-gray-600 w-24 flex-shrink-0">預定手術日期 :</span>
                        <span id="OperationStrDate" class="text-gray-800">2023/11/15</span>
                    </div>
                    <!-- Attending Surgeon -->
                    <div class="flex items-center">
                        <span class="font-medium text-gray-600 w-24 flex-shrink-0">手術主治醫師 :</span>
                        <span id="OperationDoctorName" class="text-gray-800">陳醫師</span>
                    </div>
                    <!-- Expected Surgery Name -->
                    <div class="flex items-center">
                        <span class="font-medium text-gray-600 w-24 flex-shrink-0">預計手術名稱 :</span>
                        <span id="txt_PreOPMethod" class="text-gray-800">闌尾切除術</span>
                    </div>
                     <!-- Pre-op Diagnosis -->
                    <div class="flex items-center">
                        <span class="font-medium text-gray-600 w-24 flex-shrink-0">術前診斷 :</span>
                        <span id="txt_PreDiagnosis" class="text-gray-800">急性闌尾炎</span>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Physical Info Card (NOW THIRD) -->
        <div class="bg-white rounded-lg shadow-lg mb-6 overflow-hidden">
            <!-- Card Header -->
            <div id="collapse_header_physical" class="bg-gray-200 p-4 flex items-center justify-between cursor-pointer" data-collapse-target="collapse_PhysicalContent">
                <label class="text-lg font-semibold text-gray-700">身體資訊 (Physical Info)</label>
                <button class="toggle-btn text-gray-500">
                    <svg class="w-6 h-6 transition-transform transform" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                    </svg>
                </button>
            </div>
            <!-- Card Body -->
            <div id="collapse_PhysicalContent" class="collapse-content overflow-hidden transition-all duration-300 ease-in-out">
                <div class="p-4 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-y-4 gap-x-6">
                    <!-- Height -->
                    <div class="flex items-center space-x-0.5">
                        <span class="font-medium text-gray-600 w-16 flex-shrink-0">身高 :</span>
                        <div class="relative flex items-center flex-grow">
                            <input type="text" id="PatHeight" value="175 cm" class="bg-gray-100 p-2 pr-8 rounded-md w-full border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-500" readonly>
                            <button id="EditPatHeight" class="pat-edit-btn absolute right-2 text-gray-500 hover:text-green-600 focus:outline-none">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                  <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    <!-- Weight -->
                    <div class="flex items-center space-x-0.5">
                        <span class="font-medium text-gray-600 w-16 flex-shrink-0">體重 :</span>
                        <div class="relative flex items-center flex-grow">
                            <input type="text" id="PatWeight" value="70 kg" class="bg-gray-100 p-2 pr-8 rounded-md w-full border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-500" readonly>
                            <button id="EditPatWeight" class="pat-edit-btn absolute right-2 text-gray-500 hover:text-green-600 focus:outline-none">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                  <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    <!-- BMI -->
                    <div class="flex items-center">
                        <span class="font-medium text-gray-600 w-24 flex-shrink-0">BMI :</span>
                        <span id="PatBMI" class="text-gray-800">22.86</span>
                    </div>
                    <!-- Temperature -->
                    <div class="flex items-center space-x-0.5">
                        <span class="font-medium text-gray-600 w-16 flex-shrink-0">體溫 :</span>
                        <div class="relative flex items-center flex-grow">
                            <input type="text" id="PatTemperature" value="36.5 °C" class="bg-gray-100 p-2 pr-8 rounded-md w-full border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-500" readonly>
                            <button id="EditPatTemperature" class="pat-edit-btn absolute right-2 text-gray-500 hover:text-green-600 focus:outline-none">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                  <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    <!-- Heart Beat -->
                    <div class="flex items-center space-x-0.5">
                        <span class="font-medium text-gray-600 w-16 flex-shrink-0">心跳 :</span>
                        <div class="relative flex items-center flex-grow">
                            <input type="text" id="PatHeartBeat" value="72 bpm" class="bg-gray-100 p-2 pr-8 rounded-md w-full border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-500" readonly>
                            <button id="EditPatHeartBeat" class="pat-edit-btn absolute right-2 text-gray-500 hover:text-green-600 focus:outline-none">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                  <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    <!-- Blood Pressure -->
                    <div class="flex items-center space-x-0.5">
                        <span class="font-medium text-gray-600 w-16 flex-shrink-0">血壓 :</span>
                        <div class="relative flex items-center flex-grow">
                            <input type="text" id="PatBloodPressure" value="120/80 mmHg" class="bg-gray-100 p-2 pr-8 rounded-md w-full border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-500" readonly>
                            <button id="EditPatBloodPressure" class="pat-edit-btn absolute right-2 text-gray-500 hover:text-green-600 focus:outline-none">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                  <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    <!-- Respiratory Rate -->
                     <div class="flex items-center space-x-0.5">
                        <span class="font-medium text-gray-600 w-16 flex-shrink-0">呼吸 :</span>
                        <div class="relative flex items-center flex-grow">
                            <input type="text" id="PatBreathe" value="16 bpm" class="bg-gray-100 p-2 pr-8 rounded-md w-full border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-500" readonly>
                            <button id="EditPatBreathe" class="pat-edit-btn absolute right-2 text-gray-500 hover:text-green-600 focus:outline-none">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                  <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Functionality to toggle collapse/expand of cards
            document.querySelectorAll('[data-collapse-target]').forEach(header => {
                header.addEventListener('click', () => {
                    const targetId = header.getAttribute('data-collapse-target');
                    const targetContent = document.getElementById(targetId);
                    const isExpanded = targetContent.style.maxHeight && targetContent.style.maxHeight !== '0px';

                    // Toggle the collapse content
                    if (isExpanded) {
                        targetContent.style.maxHeight = '0px';
                        header.querySelector('.toggle-btn svg').classList.remove('rotate-180');
                    } else {
                        targetContent.style.maxHeight = targetContent.scrollHeight + 'px';
                        header.querySelector('.toggle-btn svg').classList.add('rotate-180');
                    }
                });
            });

            // Initial collapse state for all cards
            document.querySelectorAll('.collapse-content').forEach(content => {
                content.style.maxHeight = content.scrollHeight + 'px'; // Start expanded
            });

            // Make edit buttons functional (for demonstration)
            document.querySelectorAll('.pat-edit-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation(); // Prevent the card from collapsing
                    const input = btn.previousElementSibling;
                    const isReadonly = input.hasAttribute('readonly');
                    if (isReadonly) {
                        input.removeAttribute('readonly');
                        input.focus();
                        input.style.backgroundColor = '#e5e7eb'; // change background on edit
                    } else {
                        input.setAttribute('readonly', 'true');
                        input.style.backgroundColor = ''; // revert background
                    }
                });
            });
        });
    </script>
</body>
</html>
