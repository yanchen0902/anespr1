    <script>
    // Synchronize server-side session with client-side sessionStorage
    (function() {
        // Get server-side session variables (passed from Flask)
        const serverUserId = '{{ user_id }}'; 
        const serverCurrentStep = '{{ server_current_step }}';
        
        console.log('Server provided user_id:', serverUserId);
        console.log('Server provided current_step:', serverCurrentStep);
        
        // If server provided a valid user_id and it differs from what's in sessionStorage,
        // or if server indicates we're at the 'initial' step, reset the client storage
        if (serverUserId && (serverUserId !== sessionStorage.getItem('userId') || serverCurrentStep === 'initial')) {
            console.log('Synchronizing client sessionStorage with server session');
            
            // Clear any existing sessionStorage data
            sessionStorage.clear();
            
            // Set the new user_id from server
            sessionStorage.setItem('userId', serverUserId);
            
            // Set the current_step from server
            sessionStorage.setItem('current_step', serverCurrentStep);
            
            console.log('Client storage synchronized with server. userId:', serverUserId, 'current_step:', serverCurrentStep);
        }
    })();
    </script>

    <script>
        // Voice interaction code
        const voiceInputBtn = document.getElementById('voiceInputBtn');
        const toggleSpeakBtn = document.getElementById('toggleSpeakBtn');
        const userInput = document.getElementById('user-input');
        let isListening = false;
        let speakResponses = true;

        // Speech recognition setup
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'zh-TW';
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onresult = (event) => {
            let transcript = event.results[0][0].transcript;
            
            // Remove trailing periods, commas, and other punctuation that might be automatically added
            transcript = transcript.replace(/[。，,.!?！？]+$/, '');
            
            userInput.value = transcript;
            sendMessage(transcript);
        };

        recognition.onend = () => {
            isListening = false;
            voiceInputBtn.classList.remove('recording');
        };

        recognition.onerror = (event) => {
            console.error('Speech recognition error:', event.error);
            isListening = false;
            voiceInputBtn.classList.remove('recording');
            if (event.error === 'not-allowed') {
                alert('請允許使用麥克風以啟用語音輸入功能。');
            }
        };

        voiceInputBtn.addEventListener('click', () => {
            if (!isListening) {
                recognition.start();
                isListening = true;
                voiceInputBtn.classList.add('recording');
            } else {
                recognition.stop();
                isListening = false;
                voiceInputBtn.classList.remove('recording');
            }
        });

        // Text-to-speech setup
        const speak = (text) => {
            if (!speakResponses) return;
            
            // Remove markdown and HTML tags for cleaner speech
            let cleanText = text.replace(/\*\*/g, '')
                               .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
                               .replace(/<[^>]+>/g, '')
                               .replace(/\n/g, ' ');
            
            // Handle numbers in Chinese text to prevent period marks
            // Replace sequences of digits with spaces between each digit
            cleanText = cleanText.replace(/(\d+)/g, (match) => {
                return match.split('').join(' ');
            });
            
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'zh-TW';
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            speechSynthesis.speak(utterance);
        };

        toggleSpeakBtn.addEventListener('click', () => {
            speakResponses = !speakResponses;
            
            // Update the title/tooltip text
            toggleSpeakBtn.setAttribute('title', speakResponses ? '語音回應' : '語音回應已關閉');
            
            // Add or remove a class for visual feedback
            if (speakResponses) {
                toggleSpeakBtn.classList.remove('disabled');
            } else {
                toggleSpeakBtn.classList.add('disabled');
                speechSynthesis.cancel();
            }
        });

        // Override the addMessageToChat function from chat.js to include speech
        document.addEventListener('DOMContentLoaded', function() {
            // Store the original function
            const originalAddMessageToChat = window.addMessageToChat;
            
            // Override with our enhanced version
            window.addMessageToChat = function(role, message) {
                // Call the original function first
                originalAddMessageToChat(role, message);
                
                // Add speech for bot messages
                if (role === 'bot' && speakResponses) {
                    console.log('Speaking bot message:', message.substring(0, 50) + '...');
                    speak(message);
                }
            };
            
            console.log('Voice functionality initialized');
        });
        
        // Function to show fracture options
        function showFractureOptions() {
            // Hide all other button groups
            hideAllButtons();
            
            // Show fracture options
            document.getElementById('fracture-options').style.display = 'flex';
            document.getElementById('fracture-options').classList.add('visible');
            
            // Scroll to bottom after showing options
            scrollToBottom();
        }
        
        // Mobile sidebar toggle functionality
        document.addEventListener('DOMContentLoaded', function() {
            const sidebarToggle = document.getElementById('sidebarToggle');
            const sidebar = document.querySelector('.info-sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            
            // Function to toggle sidebar
            function toggleSidebar() {
                sidebar.classList.toggle('active');
                overlay.classList.toggle('active');
            }
            
            // Toggle sidebar when button is clicked
            sidebarToggle.addEventListener('click', toggleSidebar);
            
            // Close sidebar when overlay is clicked
            overlay.addEventListener('click', toggleSidebar);
            
            // Set correct viewport height for mobile browsers
            function setViewportHeight() {
                let vh = window.innerHeight * 0.01;
                document.documentElement.style.setProperty('--vh', `${vh}px`);
            }
            
            // Set initial viewport height and update on resize
            setViewportHeight();
            window.addEventListener('resize', setViewportHeight);

            // New: Show option buttons on mobile input focus
            const userInputField = document.getElementById('user-input');
            const optionsWrapper = document.getElementById('option-buttons-container');

            if (userInputField && optionsWrapper) {
                userInputField.addEventListener('focus', () => {
                    if (window.innerWidth <= 576) {
                        optionsWrapper.style.display = 'flex'; // Show the container
                    }
                });
            }
        });
    </script>
